{{- if not .Values.readOnly }}
{{- if or (not .Values.audit.existingClaim) (not .Values.authority.approvalClaim) (not .Values.authority.controllerScopes) }}
{{- fail "Writable mode requires persistent audit and read-only approval claims plus controllerScopes." }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Writable mode requires one replica and a local durable SQLite volume." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-unifi.fullname" . }}
  labels:
    {{- include "mcp-unifi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-unifi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-unifi.selectorLabels" . | nindent 8 }}
    spec:
      {{- if and (or .Values.audit.existingClaim .Values.authority.approvalClaim) (hasKey .Values.podSecurityContext "fsGroup") }}
      {{- fail "Persistent private storage must be owner-provisioned without fsGroup permission rewriting." }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if and (not .Values.audit.existingClaim) (not .Values.authority.approvalClaim) }}
        fsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: {{ .Values.service.port | quote }}
            - name: STUB_MODE
              value: {{ .Values.unifi.stubMode | quote }}
            - name: UNIFI_HOST
              value: {{ .Values.unifi.host | quote }}
            - name: UNIFI_PORT
              value: {{ .Values.unifi.port | quote }}
            - name: UNIFI_SITE
              value: {{ .Values.unifi.site | quote }}
            - name: UNIFI_VERIFY_SSL
              value: {{ .Values.unifi.verifySSL | quote }}
            - name: MCP_UNIFI_MODULES_ENABLED
              value: {{ .Values.modulesEnabled | quote }}
            - name: MCP_UNIFI_AUTH_REQUIRED
              value: {{ .Values.auth.required | quote }}
            - name: MCP_UNIFI_READONLY
              value: {{ .Values.readOnly | quote }}
            - name: MCP_UNIFI_AUDIT_SINK
              value: "file"
            - name: MCP_UNIFI_AUDIT_PATH
              value: "/var/lib/mcp-unifi/private/audit.jsonl"
            - name: MCP_UNIFI_MUTATION_JOURNAL
              value: "/var/lib/mcp-unifi/private/mutations.sqlite"
            - name: MCP_UNIFI_CONTROLLER_SCOPES
              value: {{ .Values.authority.controllerScopes | toJson | quote }}
            {{- if .Values.authority.approvalClaim }}
            - name: MCP_UNIFI_APPROVAL_DIR
              value: "/etc/mcp-unifi/approvals"
            {{- end }}
            {{- if or .Values.existingSecret .Values.unifi.apiKey }}
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-unifi.secretName" . }}
                  key: UNIFI_API_KEY
            {{- end }}
            {{- if or .Values.existingSecret .Values.auth.tokens }}
            - name: MCP_UNIFI_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-unifi.secretName" . }}
                  key: MCP_UNIFI_AUTH_TOKENS
                  optional: {{ ternary "true" "false" (not .Values.auth.tokens) }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: audit
              mountPath: /var/lib/mcp-unifi
            {{- if .Values.authority.approvalClaim }}
            - name: approvals
              mountPath: /etc/mcp-unifi/approvals
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: audit
          {{- if .Values.audit.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.audit.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.authority.approvalClaim }}
        - name: approvals
          persistentVolumeClaim:
            claimName: {{ .Values.authority.approvalClaim }}
        {{- end }}
